# Este workflow roda depois que um Pull Request e aceito na main.
# Ele confere de novo, constroi, e SO ENTAO publica —
# e a publicacao espera um humano apertar o botao.

name: Publicar site da turma

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Se varios PRs forem aceitos seguidos, so a ultima publicacao importa.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:

  construir:
    name: 1 - Conferir e construir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rodar as regras do projeto
        run: python3 scripts/check.py
      - name: Transformar os textos em pagina
        run: python3 scripts/build.py
      - name: Guardar o site pronto
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    name: 2 - Publicar (precisa de aprovacao humana)
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: producao
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Colocar no ar
        id: deploy
        uses: actions/deploy-pages@v4
